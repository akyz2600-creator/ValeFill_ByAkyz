name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar plantilla (public/vale-azul.jpg)
        run: |
          if [ ! -f public/vale-azul.jpg ]; then
            echo "::error title=Falta la plantilla::No existe public/vale-azul.jpg. Agrega la imagen original del vale azul a esa ruta y vuelve a ejecutar."
            exit 1
          fi

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17 (requerido por Capacitor 6 / Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Pruebas unitarias (dinero, validación, ajuste de texto)
        run: npm test

      - name: Verificar tipos (TypeScript)
        # No bloquea el APK: el error queda como anotación visible. Quita continue-on-error cuando esté en verde.
        continue-on-error: true
        run: npm run typecheck

      - name: Compilar la app web (Vite)
        run: npm run build

      - name: Generar proyecto Android (Capacitor) si no existe
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generar íconos de la app
        # Opcional: si falla, el APK se compila con el ícono por defecto.
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar que el APK existe
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ValeFill-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
